name: APK Derle
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Sabit imza anahtarini yerlestir
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Projeyi olustur ve derle
        run: |
          flutter create --org com.lahza --project-name lahza app
          cp lib/main.dart app/lib/main.dart
          cd app
          flutter pub add camera
          flutter pub add gal
          flutter pub add image
          flutter pub add google_mlkit_face_detection
          flutter pub add google_mlkit_pose_detection
          flutter pub add dev:flutter_launcher_icons
          mkdir -p assets
          cp ../icon.png ../icon_fg.png assets/
          cp ../flutter_launcher_icons.yaml .
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="lahza"|android:label="Lahzâ"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|signingConfig = signingConfigs.getByName("debug")|signingConfig = signingConfig
