name: APK Derle
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Sabit imza anahtarini yerlestir
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Projeyi olustur ve derle
        run: |
          flutter create --org com.lahza --project-name lahza app
          cp lib/main.dart app/lib/main.dart
          cd app
          flutter pub add camera
          flutter pub add gal
          flutter pub add image
          flutter pub add path_provider
          flutter pub add google_mlkit_face_detection
          flutter pub add google_mlkit_pose_detection
          flutter pub add sensors_plus
          flutter pub add audioplayers
          flutter pub add dev:flutter_launcher_icons
          mkdir -p assets
          cp ../icon.png ../icon_fg.png assets/
          cp ../flutter_launcher_icons.yaml .
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml
          # Albüme kayıt (gal): Android 10 ve altı için yazma izni. Kamera eklentisi
          # aynı izni maxSdk 28 ile tanımlıyor; tools:replace ile 29 değerimiz geçerli olsun.
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android"|<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" tools:replace="android:maxSdkVersion"/>\n    <application android:requestLegacyExternalStorage="true"|' android/app/src/main/AndroidManifest.xml
          grep -n "manifest xmlns\|WRITE_EXTERNAL" android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="lahza"|android:label="Lahzâ"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|signingConfig = signingConfigs.getByName("debug")|signingConfig = signingConfigs.getByName("debug")\n            isMinifyEnabled = false\n            isShrinkResources = false|' android/app/build.gradle.kts
          grep -n "isMinifyEnabled" android/app/build.gradle.kts
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: lahza-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
